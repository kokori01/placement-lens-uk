[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "placement-lens-uk"
version = "0.1.0"
description = "Explainable UK data-career intelligence and job matching platform"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "kokori01" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
]

[project.scripts]
placement-lens = "placement_lens.cli:main"

[project.urls]
Repository = "https://github.com/kokori01/placement-lens-uk"
Issues = "https://github.com/kokori01/placement-lens-uk/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
placement_lens = ["static/*.html"]
